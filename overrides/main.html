{% extends "base.html" %}

{% block extrahead %}
  {% set title = config.site_name if page.is_homepage else (page.title | striptags) ~ " - " ~ config.site_name %}
  {% set image = config.site_url ~ "assets/logo/og.png" %}
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ config.site_name }}">
  <meta property="og:title" content="{{ title }}">
  <meta property="og:description" content="{{ config.site_description }}">
  <meta property="og:image" content="{{ image }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  {% if page.canonical_url %}
    <meta property="og:url" content="{{ page.canonical_url }}">
  {% endif %}
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="{{ image }}">
  <link rel="apple-touch-icon" href="{{ 'assets/logo/apple-touch-icon.png' | url }}">
{% endblock %}
