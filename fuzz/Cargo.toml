[package]
name = "apk-info-fuzz"
description = "fuzz internal structures"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true
publish = false

[package.metadata]
cargo-fuzz = true

[lib]
path = "src/lib.rs"
test = false
doc = false

[dependencies]
apk-info-axml.workspace = true
apk-info-zip = { workspace = true, features = ["fuzzing"] }
crc32fast.workspace = true
flate2.workspace = true
libfuzzer-sys = { version = "0.4", features = ["arbitrary-derive"] }
roxmltree = "0.21"

[[bin]]
name = "axml-fuzzer"
path = "fuzz_targets/axml-fuzzer.rs"
test = false
doc = false

[[bin]]
name = "arsc-fuzzer"
path = "fuzz_targets/arsc-fuzzer.rs"
test = false
doc = false

[[bin]]
name = "zip-fuzzer"
path = "fuzz_targets/zip-fuzzer.rs"
test = false
doc = false

[[bin]]
name = "zip-structured-fuzzer"
path = "fuzz_targets/zip-structured-fuzzer.rs"
test = false
doc = false

[[bin]]
name = "signing-fuzzer"
path = "fuzz_targets/signing-fuzzer.rs"
test = false
doc = false

[[bin]]
name = "ber-fuzzer"
path = "fuzz_targets/ber-fuzzer.rs"
test = false
doc = false
