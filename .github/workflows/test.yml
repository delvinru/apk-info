name: test
on:
  push:
    branches: [main]
    paths:
      - "**.rs"
      - "python/**"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "**/tests/**"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "**.rs"
      - "python/**"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "**/tests/**"
      - ".github/workflows/test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test - (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: test

      - name: Run tests
        run: cargo test --workspace --exclude apk-info-fuzz --exclude apk-info-python --locked

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read MSRV from Cargo.toml
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: msrv

      - name: Build on MSRV
        run: cargo build --workspace --exclude apk-info-fuzz --exclude apk-info-python --all-targets --locked

  python:
    name: python stubs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: python

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.3

      # apk_info/__init__.pyi is written by hand: check it against the built module
      - name: Check the type stubs
        working-directory: python
        run: |
          uv venv --python 3.13
          uv pip install maturin pytest
          uv run --no-project maturin develop --uv
          uv run --no-project pytest tests
