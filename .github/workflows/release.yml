name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
permissions:
  contents: write
  actions: write

jobs:
  build:
    uses: ./.github/workflows/build.yml
    secrets: inherit

  publish-pypi:
    name: Release (pypi)
    runs-on: ubuntu-latest
    needs: [build]
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      id-token: write
      contents: write
      attestations: write
    environment:
      name: pypi
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/download-artifact@v4

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "wheels-*/*"

      - name: Publish to PyPI
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: PyO3/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          command: upload
          args: --non-interactive --skip-existing wheels-*/*

  publish-crate:
    name: Release (crates.io)
    needs: [build]
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    environment:
      name: crates
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Publish crate
        run: |
          cargo login ${{ secrets.CRATES_API_TOKEN }}
          cargo publish -p apk-info-zip
          cargo publish -p apk-info-xml
          cargo publish -p apk-info-axml
          cargo publish -p apk-info
          cargo publish -p apk-info-cli

  publish-github:
    name: Release (github)
    needs: [build]
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: apk-info*

      - name: Generating release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: apk-info*/apk-info*
