name: lint
on:
  push:
    paths:
      - "**.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "rustfmt.toml"
      - "clippy.toml"
      - ".github/workflows/lint.yml"
  pull_request:
    paths:
      - "**.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "rustfmt.toml"
      - "clippy.toml"
      - ".github/workflows/lint.yml"

jobs:
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - name: install rust components
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --tests -- --deny clippy::all

  rustfmt:
    name: rustfmt
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - name: install rust components
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo fmt --all --check
